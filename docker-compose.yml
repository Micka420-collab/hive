# Hive — une ruche qui redémarre toute seule, sur une machine qu'on n'ouvre pas.
#
#     cp .env.example .env   # puis HIVE_TOKEN et HIVE_JWT_SECRET
#     docker compose up -d --wait
#
# ─── CE QUE CE FICHIER DÉMARRE — ET CE QU'IL NE DÉMARRE PAS ─────────────────
#
# UNE REINE, et aucune ouvrière. Les ouvrières font tourner les agents de
# codage (Claude Code, Codex, Cursor…) avec les identifiants de LEUR machine :
# les mettre dans ce conteneur leur donnerait une maison sans clés. Une ruche
# en compose attend donc qu'une machine la rejoigne — celle-ci, depuis le
# dépôt (`HIVE_URL=ws://127.0.0.1:7777/ws npm run node`), ou une autre, par un
# billet émis SUR L'HÔTE : `npm run cli -- tunnel` depuis le dépôt, puis
# `join` là-bas. Pas de billet émis DANS le conteneur : il y annoncerait
# l'adresse du pont Docker (172.x), que nulle autre machine n'atteint — et
# l'image n'a pas de binaire de tunnel. Tant qu'aucune ouvrière n'est venue,
# les tâches attendent, et l'écran le dit.
# Le détail : `docs/INSTALLATION.md`, « Dans un conteneur ».
#
# ─── CE QUE CE FICHIER DÉCIDE, ET POURQUOI ──────────────────────────────────
#
# Trois choix qui ne sont pas des détails de confort.

services:
  ruche:
    build: .
    image: hive:local
    # `unless-stopped` et pas `always` : si vous arrêtez la ruche à la main,
    # elle reste arrêtée, même après un redémarrage de la machine. Un logiciel
    # qui repart quand on l'a éteint est un logiciel qu'on ne contrôle pas —
    # c'est la même décision que le `SuccessfulExit=false` du LaunchAgent.
    restart: unless-stopped

    # ─── LE PORT EST PUBLIÉ SUR LA BOUCLE LOCALE, PAS SUR LE RÉSEAU ─────────
    #
    # `127.0.0.1:7777:7777` et non `7777:7777`. La forme courte publie sur
    # TOUTES les interfaces de l'hôte — et, sous Linux, Docker écrit ses règles
    # DIRECTEMENT dans netfilter, en amont de la plupart des pare-feu : une
    # ruche ouverte sur Internet sans que rien ne l'ait annoncé.
    #
    # Pour l'ouvrir vraiment, il y a `hive tunnel` : chiffré, révocable, et qui
    # ne demande pas de toucher à un pare-feu.
    ports:
      - '127.0.0.1:7777:7777'

    # ─── UN VRAI PID 1 DEVANT LA REINE ──────────────────────────────────────
    #
    # La Reine lance git (le miroir du Rayon), et git lance ses propres aides
    # (`git-remote-https`). Un orphelin est rattaché au PID 1 de l'espace de
    # noms — ici `node`, qui ne ramasse personne : les zombies s'empilaient.
    # `init: true` place l'init de Docker devant, qui les ramasse et transmet
    # les signaux. Quand la Reine meurt, il meurt avec elle : le conteneur
    # s'arrête, et `unless-stopped` le relance.
    init: true

    # Les secrets viennent d'un fichier, jamais de la ligne de commande : un
    # `docker run -e HIVE_TOKEN=…` se lit dans `ps` de n'importe quel compte de
    # la machine. C'est la contrainte §5.1 du projet, appliquée ici.
    env_file:
      - .env

    # ─── CE QUE `.env` NE DOIT PAS DÉCIDER ──────────────────────────────────
    #
    # `env_file` PRIME sur les `ENV` de l'image. Or le `.env` qu'on obtient par
    # `cp .env.example .env` — ou par l'installeur — décrit une ruche posée SUR
    # L'HÔTE : `HIVE_HOST=127.0.0.1`, un `HIVE_PORT` parfois déplacé, un
    # `HIVE_DB` en chemin de l'hôte. Dans le conteneur, le premier faisait
    # écouter la Reine sur SA boucle locale : la sonde de santé (lancée dedans)
    # la disait saine, et la redirection de port ne trouvait personne. Ces
    # quatre valeurs décrivent la forme du CONTENEUR ; `environment` prime sur
    # `env_file`, elles sont donc posées ici. Pour un autre port sur l'hôte,
    # changez la partie gauche de `ports`, pas `HIVE_PORT`.
    environment:
      HIVE_HOST: 0.0.0.0
      HIVE_PORT: 7777
      HIVE_DB: /app/data/hive.db
      HIVE_ENV_FILE: /app/data/queen.env

    volumes:
      # La mémoire de la ruche. Un volume nommé, pas un montage de dossier :
      # il survit à `docker compose down`, et ne dépend pas des permissions du
      # dossier hôte.
      - hive-donnees:/app/data

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:'+(process.env.HIVE_PORT||7777)+'/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

    # ─── DURCISSEMENT ───────────────────────────────────────────────────────
    #
    # Mêmes intentions que l'unité systemd du lot 9 : pas d'élévation possible,
    # rien d'inscriptible hors de ce qui doit l'être.
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      # `VACUUM INTO` et les fusions écrivent dans le dossier temporaire. Le
      # reste du système de fichiers reste en lecture seule.
      - /tmp
    cap_drop:
      - ALL

  # Bureau de recette : écran + CDP + outils. Pas d'`env_file` : aucun secret
  # de l'hôte n'entre. Le profil évite de l'allumer avec la ruche.
  #
  #     docker compose --profile atelier up -d atelier
  #
  # Voir docs/ATELIER.md. `HIVE_ATELIER=auto` (le bouton « Allumer l'atelier »,
  # POST /api/atelier/demarrer) ne vaut que pour une Reine lancée SUR L'HÔTE :
  # la Reine de ce conteneur n'a ni le client `docker` ni la socket du démon
  # — et elle ne les aura pas, ce serait lui donner l'hôte entier. Elle ne
  # voit pas non plus le démon d'outils, publié sur la boucle locale de
  # l'hôte. Ici, on allume l'atelier depuis l'hôte, par la commande ci-dessus.
  atelier:
    profiles: [atelier]
    build:
      context: .
      dockerfile: docker/atelier/Dockerfile
    image: hive-atelier:local
    restart: unless-stopped
    # Chromium lance une nuée de processus ; le script d'entrée (PID 1) ne
    # ramasse pas ceux qui deviennent orphelins. Même raison que la ruche.
    init: true
    environment:
      DISPLAY: ':99'
    volumes:
      - hive-atelier-workspace:/workspace
    ports:
      - '127.0.0.1:6080:6080'
      - '127.0.0.1:8765:8765'
      - '127.0.0.1:9222:9222'
    expose:
      - '9222'
    shm_size: 512mb
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: 2g

volumes:
  hive-donnees:
  hive-atelier-workspace:
