# Hive Cloud — la Queen sur TES serveurs, payante pour tes clients.
#
#     cp .env.example .env   # puis HIVE_EDITION=cloud, secrets, domaine
#     docker compose -f docker-compose.cloud.yml up -d
#
# Community reste `docker compose up` (docker-compose.yml) : 0 €, chez soi.

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./docker/Caddyfile.cloud:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      ruche:
        condition: service_healthy

  ruche:
    build: .
    image: hive:cloud
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HIVE_EDITION: cloud
      HIVE_HOST: 0.0.0.0
      HIVE_PORT: 7777
      HIVE_DB: /app/data/hive.db
      HIVE_BALANCE: strict
    volumes:
      - hive-cloud-donnees:/app/data
    expose:
      - '7777'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:'+(process.env.HIVE_PORT||7777)+'/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL

volumes:
  hive-cloud-donnees:
  caddy-data:
  caddy-config:
