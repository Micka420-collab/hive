name: Site

# Déploie la vitrine statique (site/) sur GitHub Pages à chaque push sur main
# qui la modifie.
#
# ─── Activation : UN geste manuel, une seule fois ───────────────────────────
# Settings → Pages → Build and deployment → Source : « GitHub Actions ».
#
# On n'utilise PAS `enablement: true` sur `actions/configure-pages` : créer le
# site Pages demande un droit d'administration que le GITHUB_TOKEN d'un dépôt
# PRIVÉ n'a pas (« Resource not accessible by integration »). Le workflow
# échouait donc au premier déploiement pour une raison que personne ne pouvait
# deviner depuis le log. On préfère un pré-vol qui dit exactement quoi faire.
#
# Rappel de plan : sur un dépôt privé, Pages exige une offre payante
# (Pro / Team / Enterprise). Sur un dépôt public, c'est gratuit.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'install.sh'
      - 'install.ps1'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Déployer la vitrine
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      # Pré-vol. DEUX vérifications, et la seconde est la plus importante.
      #
      # 1. Pages est-il activé ? Sans ça, le déploiement échoue plus loin sur une
      #    erreur d'API illisible.
      # 2. Sa SOURCE est-elle « GitHub Actions » ? C'est le piège qui a coûté le
      #    plus cher : avec la source par défaut (« Deploy from a branch »),
      #    GitHub sert le README rendu par Jekyll. Le site répond alors HTTP 200
      #    avec le MAUVAIS contenu — donc personne ne remarque l'erreur, et ce
      #    workflow peut même se croire vert. Un échec silencieux est pire qu'un
      #    échec bruyant : on le corrige des semaines plus tard.
      - name: Vérifier que Pages est activé, et sur la bonne source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! pages=$(gh api "repos/${{ github.repository }}/pages" 2>/dev/null); then
            {
              echo "## 🐝 Le site n'a pas pu être déployé"
              echo
              echo "**GitHub Pages n'est pas activé sur ce dépôt.** Le workflow ne peut pas"
              echo "l'activer lui-même : sur un dépôt privé, le \`GITHUB_TOKEN\` n'a pas le"
              echo "droit de créer le site Pages."
              echo
              echo "### Le geste à faire, une seule fois"
              echo
              echo "1. **Settings → Pages → Build and deployment**"
              echo "2. **Source** : choisir **GitHub Actions**"
              echo "3. Relancer ce workflow (onglet Actions → *Site* → *Run workflow*)"
              echo
              echo "> Sur un dépôt **privé**, Pages exige une offre payante"
              echo "> (Pro / Team / Enterprise). Rendre le dépôt **public** suffit"
              echo "> sinon — la vitrine est faite pour être vue."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=GitHub Pages non activé::Settings → Pages → Source : GitHub Actions, puis relancer ce workflow."
            exit 1
          fi

          build_type=$(echo "$pages" | jq -r '.build_type // "legacy"')
          if [ "$build_type" != "workflow" ]; then
            {
              echo "## 🐝 Pages est activé, mais il ne sert PAS cette vitrine"
              echo
              echo "Source actuelle : \`$build_type\` (« Deploy from a branch »)."
              echo
              echo "Avec ce réglage, GitHub publie le **README rendu par Jekyll** à la place"
              echo "de \`site/index.html\`. Le site répond bien en HTTP 200 — avec le mauvais"
              echo "contenu. C'est pour cela que ce contrôle existe : sans lui, l'erreur"
              echo "passe inaperçue."
              echo
              echo "### Le geste à faire"
              echo
              echo "1. **Settings → Pages → Build and deployment**"
              echo "2. **Source** : passer de « Deploy from a branch » à **GitHub Actions**"
              echo "3. Relancer ce workflow"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Source Pages incorrecte::Source « $build_type » : GitHub sert le README, pas la vitrine. Settings → Pages → Source : GitHub Actions."
            exit 1
          fi
          echo "✅ Pages activé, source « workflow » — la vitrine sera bien servie."

      - name: Configurer Pages
        uses: actions/configure-pages@v5

      # ADR 0002 : les one-liners Pages servent les MÊMES scripts que la racine.
      # Copier à l'empaquetage évite deux copies qui dérivent (leçon § 9 ter).
      - name: Publier les installeurs sur la vitrine
        run: |
          cp install.sh install.ps1 site/
          ls -la site/install.sh site/install.ps1
          (cd site && sha256sum install.sh install.ps1 | tee install.sha256)

      - name: Empaqueter le site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
