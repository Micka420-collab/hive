name: Application de bureau

# L'APPLICATION DE BUREAU, CONSTRUITE ET LANCÉE SUR LES TROIS SYSTÈMES (ADR 0013).
#
# Chaque paquet est construit sur SON système — NSIS sous Windows, DMG sous
# macOS, AppImage et .deb sous Linux —, puis INSTALLÉ comme le ferait
# quelqu'un et lancé avec `--diagnostic` (`desktop/scripts/fumee.mjs`) : la
# Reine doit s'annoncer, `/api/health` répondre `{ ok: true }`, la fenêtre
# charger l'écran de la Reine sans violation de CSP, et une capture en sortir.
# Sous Windows, la désinstallation silencieuse doit en plus LAISSER la ruche
# en place.
#
# ─── QUAND ───────────────────────────────────────────────────────────────────
#
#   · une PR ou `main` qui touche l'app, le code qu'elle embarque (`src/`,
#     `dashboard/`) ou les dépendances : construire + banc de fumée ;
#   · une étiquette `vX.Y.Z` : la même chose, PUIS la publication dans une
#     Release GitHub BROUILLON (paquets + `latest*.yml` d'electron-updater).
#     Publier la Release reste un geste humain — c'est lui qui déclenche les
#     mises à jour chez les utilisateurs (docs/RELEASING.md).
#
# ─── LA SIGNATURE, PRÊTE ET ÉTEINTE ──────────────────────────────────────────
#
# Les secrets de signature sont passés au job `publier` s'ils existent ; vides,
# rien n'est signé et tout marche (docs/APPLICATION.md § Signature). Le job
# `paquet` n'en reçoit aucun : un paquet de PR n'est jamais signé.
#
# ─── CE QUI EST PUBLIÉ EST CE QUI A ÉTÉ LANCÉ ────────────────────────────────
#
# `publier` reconstruit (pour signer), passe CES paquets au banc de fumée —
# signés, et sous macOS au regard de Gatekeeper —, puis téléverse CES
# fichiers dans la Release brouillon. electron-builder ne publie rien lui-même.
#
# Aucun `checkout` ne garde le jeton dans `.git/config`
# (`persist-credentials: false`) : les scripts d'installation des dépendances
# ne peuvent pas le lire. Seul le téléversement le reçoit, en variable.
on:
  pull_request:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'src/**'
      - 'dashboard/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/app-bureau.yml'
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'src/**'
      - 'dashboard/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/app-bureau.yml'
    tags: ['v*.*.*']
  workflow_dispatch:

concurrency:
  group: app-bureau-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE: '24'

permissions:
  contents: read

jobs:
  paquet:
    name: ${{ matrix.os }} · paquet + banc de fumée
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            dist: dist:linux
          - os: windows-latest
            dist: dist:win
          - os: macos-latest
            dist: dist:mac
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Installer Node.js ${{ env.NODE }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      # La ruche que l'app embarque : `dist/` et `dashboard/dist/`.
      - name: Construire Hive
        run: |
          npm ci --foreground-scripts
          npm run build

      - name: Installer les dépendances de l'app
        run: npm ci --prefix desktop

      - name: Construire les paquets
        run: npm --prefix desktop run ${{ matrix.dist }}
        env:
          # Aucune identité du trousseau du runner ne doit être ramassée : un
          # paquet de ce job n'est jamais signé (macOS : signature ad hoc).
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Écran virtuel (Linux)
        if: runner.os == 'Linux'
        run: command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)

      - name: Banc de fumée — AppImage et .deb
        if: runner.os == 'Linux'
        run: |
          node desktop/scripts/fumee.mjs desktop/release/Hive-*.AppImage
          node desktop/scripts/fumee.mjs desktop/release/hive_*.deb

      - name: Banc de fumée — installeur NSIS (installer, lancer, désinstaller)
        if: runner.os == 'Windows'
        shell: bash
        run: node desktop/scripts/fumee.mjs desktop/release/Hive-Setup-*.exe

      # Le runner macOS est arm64 : le DMG x64 est construit, pas lancé.
      - name: Banc de fumée — DMG
        if: runner.os == 'macOS'
        run: node desktop/scripts/fumee.mjs desktop/release/Hive-*-arm64.dmg

      - name: Publier les paquets et les rapports du banc
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hive-bureau-${{ runner.os }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.blockmap
            desktop/release/*.yml
            desktop/release/fumee/

  # La Release brouillon, créée UNE fois avant les trois téléversements.
  brouillon:
    name: Release brouillon
    if: startsWith(github.ref, 'refs/tags/v')
    needs: paquet
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Créer la Release brouillon (si elle n'existe pas)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
              --title "Hive $TAG" --notes "Brouillon — les paquets de l'application arrivent."

  publier:
    name: ${{ matrix.os }} · Release brouillon
    if: startsWith(github.ref, 'refs/tags/v')
    needs: brouillon
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cible: --linux
            paquets: Hive-*.AppImage hive_*.deb latest-linux.yml
            facultatifs: ''
          - os: windows-latest
            cible: --win
            paquets: Hive-Setup-*.exe Hive-Setup-*.exe.blockmap latest.yml
            facultatifs: ''
          - os: macos-latest
            cible: --mac --arm64 --x64
            paquets: Hive-*.dmg Hive-*.dmg.blockmap latest-mac.yml
            # Le ZIP (ce que la mise à jour macOS installe) n'est construit que
            # SIGNÉ (`macSigne` dans electron-builder.config.cjs) : exigé, il
            # ferait échouer le téléversement de toute release non signée.
            facultatifs: Hive-*.zip Hive-*.zip.blockmap
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Installer Node.js ${{ env.NODE }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Construire Hive
        run: |
          npm ci --foreground-scripts
          npm run build
          npm ci --prefix desktop
          npm --prefix desktop run build
          npm --prefix desktop run preparer-ruche

      # electron-builder attend le CHEMIN d'une clé .p8 : le secret en porte le
      # contenu. Absent, rien n'est écrit et la notarisation reste éteinte.
      - name: Clé de notarisation Apple
        if: runner.os == 'macOS'
        shell: bash
        env:
          CONTENU: ${{ secrets.APPLE_API_KEY }}
        run: |
          if [ -n "$CONTENU" ]; then
            printf '%s' "$CONTENU" > "$RUNNER_TEMP/AuthKey.p8"
            echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          fi

      - name: Construire et signer si possible
        working-directory: desktop
        shell: bash
        run: npx electron-builder --config electron-builder.config.cjs ${{ matrix.cible }} --publish never
        env:
          # macOS — seulement sur son runner : sous Windows, electron-builder
          # retomberait sur CSC_LINK faute de WIN_CSC_LINK.
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.CSC_KEY_PASSWORD || '' }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # Windows — un certificat .pfx, OU Azure Trusted Signing.
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGN_ENDPOINT: ${{ vars.AZURE_SIGN_ENDPOINT }}
          AZURE_SIGN_ACCOUNT: ${{ vars.AZURE_SIGN_ACCOUNT }}
          AZURE_SIGN_PROFILE: ${{ vars.AZURE_SIGN_PROFILE }}
          AZURE_SIGN_PUBLISHER: ${{ vars.AZURE_SIGN_PUBLISHER }}

      - name: Écran virtuel (Linux)
        if: runner.os == 'Linux'
        run: command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)

      # Le banc de fumée sur EXACTEMENT ce qui sera téléversé.
      - name: Banc de fumée des paquets à publier
        shell: bash
        env:
          # Signé ET notarisé : le DMG passe aussi par la quarantaine et `spctl`.
          HIVE_FUMEE_GATEKEEPER: ${{ runner.os == 'macOS' && secrets.CSC_LINK != '' && secrets.APPLE_API_KEY != '' && '1' || '' }}
        run: |
          case "$RUNNER_OS" in
            Linux)
              node desktop/scripts/fumee.mjs desktop/release/Hive-*.AppImage
              node desktop/scripts/fumee.mjs desktop/release/hive_*.deb ;;
            Windows) node desktop/scripts/fumee.mjs desktop/release/Hive-Setup-*.exe ;;
            macOS) node desktop/scripts/fumee.mjs desktop/release/Hive-*-arm64.dmg ;;
          esac

      - name: Téléverser les paquets éprouvés dans la Release brouillon
        working-directory: desktop/release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        # `gh` refuse un motif sans fichier (« no matches found ») : c'est voulu
        # pour les paquets exigés. Les facultatifs absents sont retirés avant.
        run: |
          shopt -s nullglob
          facultatifs=(${{ matrix.facultatifs }})
          shopt -u nullglob
          gh release upload "$TAG" ${{ matrix.paquets }} "${facultatifs[@]}" \
            --repo "$GITHUB_REPOSITORY" --clobber
