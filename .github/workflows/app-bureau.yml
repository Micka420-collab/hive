name: Application de bureau

# L'APPLICATION DE BUREAU, CONSTRUITE ET LANCÉE SUR LES TROIS SYSTÈMES (ADR 0013).
#
# Chaque paquet est construit sur SON système — NSIS sous Windows, DMG sous
# macOS, AppImage et .deb sous Linux —, puis INSTALLÉ comme le ferait
# quelqu'un et lancé avec `--diagnostic` (`desktop/scripts/fumee.mjs`) : la
# Reine doit s'annoncer, `/api/health` répondre `{ ok: true }`, la fenêtre
# charger l'écran de la Reine sans violation de CSP, et une capture en sortir.
# Sous Windows, la désinstallation silencieuse doit en plus LAISSER la ruche
# en place.
#
# ─── QUAND ───────────────────────────────────────────────────────────────────
#
#   · une PR ou `main` qui touche l'app, le code qu'elle embarque (`src/`,
#     `dashboard/`) ou les dépendances : construire + banc de fumée ;
#   · une étiquette `vX.Y.Z` : la même chose, PUIS la publication dans une
#     Release GitHub BROUILLON (paquets + `latest*.yml` d'electron-updater).
#     Publier la Release reste un geste humain — c'est lui qui déclenche les
#     mises à jour chez les utilisateurs (docs/RELEASING.md).
#
# ─── LA SIGNATURE, PRÊTE ET ÉTEINTE ──────────────────────────────────────────
#
# Les secrets de signature sont passés au job `publier` s'ils existent ; vides,
# rien n'est signé et tout marche (docs/APPLICATION.md § Signature). Le job
# `paquet` n'en reçoit aucun : un paquet de PR n'est jamais signé.
on:
  pull_request:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'src/**'
      - 'dashboard/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/app-bureau.yml'
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'src/**'
      - 'dashboard/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/app-bureau.yml'
    tags: ['v*.*.*']
  workflow_dispatch:

concurrency:
  group: app-bureau-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE: '24'

jobs:
  paquet:
    name: ${{ matrix.os }} · paquet + banc de fumée
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            dist: dist:linux
          - os: windows-latest
            dist: dist:win
          - os: macos-latest
            dist: dist:mac
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js ${{ env.NODE }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      # La ruche que l'app embarque : `dist/` et `dashboard/dist/`.
      - name: Construire Hive
        run: |
          npm ci --foreground-scripts
          npm run build

      - name: Installer les dépendances de l'app
        run: npm ci --prefix desktop

      - name: Construire les paquets
        run: npm --prefix desktop run ${{ matrix.dist }}
        env:
          # Aucune identité du trousseau du runner ne doit être ramassée : un
          # paquet de ce job n'est jamais signé (macOS : signature ad hoc).
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Écran virtuel (Linux)
        if: runner.os == 'Linux'
        run: command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)

      - name: Banc de fumée — AppImage et .deb
        if: runner.os == 'Linux'
        run: |
          node desktop/scripts/fumee.mjs desktop/release/Hive-*.AppImage
          node desktop/scripts/fumee.mjs desktop/release/hive_*.deb

      - name: Banc de fumée — installeur NSIS (installer, lancer, désinstaller)
        if: runner.os == 'Windows'
        shell: bash
        run: node desktop/scripts/fumee.mjs desktop/release/Hive-Setup-*.exe

      # Le runner macOS est arm64 : le DMG x64 est construit, pas lancé.
      - name: Banc de fumée — DMG
        if: runner.os == 'macOS'
        run: node desktop/scripts/fumee.mjs desktop/release/Hive-*-arm64.dmg

      - name: Publier les paquets et les rapports du banc
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hive-bureau-${{ runner.os }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.blockmap
            desktop/release/*.yml
            desktop/release/fumee/

  publier:
    name: ${{ matrix.os }} · Release brouillon
    if: startsWith(github.ref, 'refs/tags/v')
    needs: paquet
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cible: --linux
          - os: windows-latest
            cible: --win
          - os: macos-latest
            cible: --mac --arm64 --x64
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js ${{ env.NODE }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Construire Hive
        run: |
          npm ci --foreground-scripts
          npm run build
          npm ci --prefix desktop
          npm --prefix desktop run build
          npm --prefix desktop run preparer-ruche

      # electron-builder attend le CHEMIN d'une clé .p8 : le secret en porte le
      # contenu. Absent, rien n'est écrit et la notarisation reste éteinte.
      - name: Clé de notarisation Apple
        if: runner.os == 'macOS'
        shell: bash
        env:
          CONTENU: ${{ secrets.APPLE_API_KEY }}
        run: |
          if [ -n "$CONTENU" ]; then
            printf '%s' "$CONTENU" > "$RUNNER_TEMP/AuthKey.p8"
            echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          fi

      - name: Construire, signer si possible, publier dans la Release brouillon
        working-directory: desktop
        shell: bash
        run: npx electron-builder --config electron-builder.config.cjs ${{ matrix.cible }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS — seulement sur son runner : sous Windows, electron-builder
          # retomberait sur CSC_LINK faute de WIN_CSC_LINK.
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.CSC_KEY_PASSWORD || '' }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # Windows — un certificat .pfx, OU Azure Trusted Signing.
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGN_ENDPOINT: ${{ vars.AZURE_SIGN_ENDPOINT }}
          AZURE_SIGN_ACCOUNT: ${{ vars.AZURE_SIGN_ACCOUNT }}
          AZURE_SIGN_PROFILE: ${{ vars.AZURE_SIGN_PROFILE }}
          AZURE_SIGN_PUBLISHER: ${{ vars.AZURE_SIGN_PUBLISHER }}
