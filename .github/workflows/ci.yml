name: CI

# Intégration continue de Hive : à chaque push sur main et sur chaque PR, on
# vérifie la qualité (lint + format), le typage, les tests et le build.
#
# ─── POURQUOI TROIS SYSTÈMES, ET PAS UN ──────────────────────────────────────
#
# Le dépôt annonce Windows partout : le README, l'installeur, la matrice de
# distribution (§7.2 de la mission), et jusqu'au code — `hive doctor` rend
# `null` pour les permissions « sur Windows, où l'ACL ne se lit pas en bits
# POSIX ». Cette branche-là n'avait JAMAIS tourné sur Windows. On ne pouvait la
# vérifier qu'en passant `'win32'` en paramètre, c'est-à-dire en se croyant sur
# parole.
#
# CE QUE L'OUVRIR A COÛTÉ, ET RAPPORTÉ. Neuf allers-retours, et cinq défauts
# RÉELS qu'aucune relecture n'aurait trouvés : `npm ci` inopérant sur tout nœud
# Windows (un `.cmd` ne se lance pas sans interpréteur), un clone qui attendait
# des identifiants POUR TOUJOURS, une borne d'élagage qui gardait ZÉRO ligne au
# lieu de deux, une variante `.cmd` qui ne pouvait pas aboutir dans la détection
# d'agent, et sept avis de sécurité dont un réel. Le détail est dans
# `docs/ERREURS.md`.
#
# MACOS EST LA TROISIÈME, et le lot 6 la demandait depuis le début (« CI verte
# sur les 3 OS »). Ce n'est pas de la symétrie : c'est là que vivent `launchd`
# — le lot 9 en dépend et s'écrirait à l'aveugle sans elle —, un système de
# fichiers INSENSIBLE À LA CASSE par défaut, et l'absence de tout moteur de
# conteneurs sur les runners. Trois différences que rien n'exerce aujourd'hui.
#
# `fail-fast: false` : si plusieurs cassent, on veut TOUS les rapports. Arrêter
# les autres au premier échec transformerait trois diagnostics en un seul.

# ─── POURQUOI `workflow_dispatch` — UN INSTRUMENT, PAS UN CONFORT ────────────
#
# Sans lui, une jambe rouge ne peut PAS être rejouée sur le même commit : la
# seule façon de relancer la CI est de pousser, donc de changer le code qu'on
# essaie de juger. C'est fatal pour la seule question qui compte devant un
# échec de plateforme :
#
#     est-ce DÉTERMINISTE, ou est-ce l'intermittent connu ?
#
# Les deux réponses appellent des gestes opposés — corriger le code, ou trouver
# ce qui affame le runner — et rien ne les distingue en une seule exécution.
#
# Le 13 août, la jambe Windows a rendu quatre `Hook timed out in 20000ms` dans
# TROIS fichiers sans rapport, dont un hook SYNCHRONE (`store.close()` puis
# `rmSync`) — du code qui n'attend rien et ne peut donc qu'être privé de CPU.
# `main` était vert au commit précédent. Il fallait une seconde mesure sur le
# MÊME arbre ; le dépôt ne savait pas la produire, et l'API refuse le rejeu aux
# intégrations (403).
#
# La chasse du § « trois exécutions CI-identiques » avait déjà payé ce manque.
# Il est réparé ici, et il ne coûte rien : un déclencheur manuel ne s'exécute
# que lorsqu'on le demande.
#
# ─── QUI PEUT S'EN SERVIR, ET QUI NE PEUT PAS ────────────────────────────────
#
# Cette section disait « un humain — ou un agent qui rend des comptes ». La
# seconde moitié était FAUSSE, et écrite sans avoir été essayée. Mesuré depuis,
# deux fois, avec le même verdict :
#
#     POST …/actions/runs/{id}/rerun-failed-jobs   → 403
#     POST …/actions/workflows/ci.yml/dispatches   → 403
#     « Resource not accessible by integration »
#
# Un jeton d'intégration n'a pas `actions: write` ici. **Ce déclencheur est donc
# opérable par un humain, depuis l'onglet Actions — et par personne d'autre.**
#
# Ça ne le rend pas inutile : la question qu'il sert à trancher (déterministe ou
# intermittent ?) reste sans réponse sans lui, et une seconde mesure demandée en
# deux clics vaut mieux qu'un commit vide poussé pour relancer une CI. Mais un
# agent qui rencontre un rouge de plateforme doit le DIRE plutôt que de croire
# pouvoir le rejouer lui-même.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      forks:
        description: >-
          Plafond de processus vitest (entier ≥ 1). Vide = défaut de vitest.
          Sert à MESURER la sur-souscription en rejouant le même arbre avec et
          sans plafond ; une valeur illisible fait échouer le démarrage plutôt
          que de mesurer sans le plafond annoncé.
        required: false
        default: ''

# ─── LA VERSION DE NODE, DÉCLARÉE UNE SEULE FOIS ─────────────────────────────
#
# `NODE_MINIMUM` vaut 24 dans `src/shared/doctor.ts`, et la CI doit tourner sur
# le plancher qu'elle exige — sans quoi elle vérifierait une configuration que
# personne n'installe.
#
# Le 24 n'est pas une préférence pour le neuf. Il retire une panne :
# `better-sqlite3` est un module natif, et sous Node 20 aucun binaire prébuilt
# n'existe pour cette ABI. Il faut compiler — 42 lignes de `node-gyp` sous
# Linux, et sous Windows un échec net, le `node-gyp` d'npm 10 ne sachant pas
# lire Visual Studio 2026. Sous Node 24, `prebuild-install` trouve le binaire :
# zéro compilation, 28 secondes, aucun outillage C++ nécessaire. Les deux
# comportements ont été mesurés sur le MÊME commit, dans le run 210.
env:
  NODE: '24'

jobs:
  qualite:
    name: ${{ matrix.os }} · Node 24 · Lint · Typecheck · Tests · Build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js ${{ env.NODE }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE }}
          cache: npm

      # `--foreground-scripts` rend VISIBLE ce que font les scripts d'install.
      # Sans lui, l'échec du module natif de `better-sqlite3` — qui est une
      # dépendance OPTIONNELLE, donc silencieusement abandonnée — n'apparaît
      # nulle part, et on hérite de 68 fichiers de test qui échouent à l'import
      # sans qu'aucune ligne du journal n'explique pourquoi.
      - name: Installer les dépendances
        run: npm ci --foreground-scripts

      # Et on DIT ce qui a atterri. Un `npm ci` vert avec Fastify et SQLite
      # absents est le pire des deux : tout a l'air d'aller.
      - name: Ce que les dépendances optionnelles ont donné
        run: node scripts/deps-optionnelles.mjs

      # ─── AUCUNE VULN HAUTE NE PASSE — le gate que le DoD réclamait ──────────
      #
      # `docs/DEFINITION-DE-SORTIE.md` § C notait « défendu » comme NON MESURÉ :
      # rien ne faisait ROUGIR la sortie sur une vuln haute d'une dépendance.
      # Cette étape EST ce gate. Le jour où elle est née, elle a trouvé deux
      # vulns hautes — `brace-expansion` (GHSA-rgw5-rvv9-x895) et `fast-uri`
      # (GHSA-7p8r-x3mc-p8w7), toutes deux transitives —, fermées par
      # `npm audit fix`.
      #
      # `--audit-level=high` barre sur HAUTE et CRITIQUE, pas sur les modérées :
      # un seuil qui refuse le vrai danger sans hurler à chaque broutille. Coût
      # assumé : un avis publié demain sur une transitive rougira la CI même sans
      # changement de code. C'est le but — une vuln haute qui dort est pire.
      #
      # Une seule jambe (Linux) : l'arbre de dépendances ne dépend pas de l'OS,
      # et l'auditer trois fois ne ferait que tripler le risque d'un hoquet du
      # registre.
      - name: Aucune vulnérabilité haute dans les dépendances
        if: runner.os == 'Linux'
        run: npm audit --audit-level=high

      - name: Lint (ESLint + Prettier)
        run: npm run lint

      - name: Typecheck (orchestrateur + nœud)
        run: npm run typecheck

      - name: Typecheck (dashboard)
        run: npm run typecheck:dashboard

      # ─── LE JUGE DOIT ÊTRE LÀ AVANT QU'ON LUI DEMANDE SON AVIS ──────────────
      #
      # `tests/service-accepte.test.ts` soumet le fichier de service à l'outil
      # de la plateforme : `systemd-analyze verify` sous Linux, `plutil -lint`
      # sous macOS, `schtasks` sous Windows. C'est ce qui a montré que l'unité
      # systemd de Hive était REFUSÉE depuis le premier jour.
      #
      # Ces tests sont des `runIf` : si l'outil disparaissait de l'image, ils
      # seraient sautés — donc verts, et sans objet. Cette étape refuse ce
      # silence-là. Elle tourne AVANT la suite pour que la panne se lise sur son
      # propre nom, pas au milieu de 3 000 tests.
      #
      # On teste la PRÉSENCE, pas le code de sortie. Première version :
      # `plutil 2>&1 | head -1` — or `plutil` sans argument imprime son mode
      # d'emploi et sort en NON NUL, ce que `-o pipefail` a fidèlement propagé.
      # La jambe macOS a échoué sur un outil parfaitement présent.
      #
      # `command -v` évite les deux pièges : il ne lance rien, et il ne passe
      # aucun argument — sous Git Bash, `/Query` serait converti en chemin
      # Windows avant même d'atteindre `schtasks`.
      - name: L’outil qui juge le fichier de service est là
        shell: bash
        run: |
          set -e
          case "${{ runner.os }}" in
            Linux)   outil=systemd-analyze ;;
            macOS)   outil=plutil ;;
            Windows) outil=schtasks ;;
          esac
          if ! command -v "$outil" >/dev/null 2>&1 && ! command -v "$outil.exe" >/dev/null 2>&1; then
            echo "::error::« $outil » est introuvable : les gardes de tests/service-accepte.test.ts seraient sautées, donc vertes et sans objet."
            exit 1
          fi
          echo "✔ $outil"

      # ─── BUBBLEWRAP : LE BAC SANS DÉMON, EXERCÉ POUR DE VRAI ────────────────
      #
      # `tests/isolement-runtime.integration.test.ts` lance le vrai bubblewrap
      # sur un agent installé dans un HOME, comme sur le poste d'un membre. Sans
      # bubblewrap, ces bancs seraient SAUTÉS — donc verts et sans objet, comme
      # ceux du fichier de service ci-dessus. D'où `HIVE_BWRAP_REQUIS=1` : sur
      # cette jambe, un bubblewrap absent ou bloqué fait ÉCHOUER le banc.
      #
      # Ubuntu 24.04 restreint les espaces de noms utilisateur non privilégiés
      # par AppArmor, et `bwrap --version` répond quand même : on éprouve un vrai
      # lancement, et on ne lève la restriction que s'il échoue (même geste que
      # la CI de Codex, `.github/actions/setup-ci`).
      - name: Installer bubblewrap (bac à sable Linux)
        if: runner.os == 'Linux'
        run: |
          set -e
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends bubblewrap
          if ! bwrap --ro-bind / / --unshare-all -- true 2>/dev/null; then
            echo "bwrap refusé par la restriction des espaces de noms : on la lève pour ce runner"
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --ro-bind / / --unshare-all -- true
          bwrap --version
          echo "HIVE_BWRAP_REQUIS=1" >> "$GITHUB_ENV"

      - name: Tests (vitest, unitaires + e2e)
        # `HIVE_VITEST_FORKS` est VIDE sur push et sur PR : `inputs.forks`
        # n'existe que pour un déclenchement manuel, et une chaîne vide laisse
        # vitest décider. Le comportement ordinaire de la CI est donc inchangé,
        # et le plafond ne s'applique que lorsqu'on mesure exprès.
        #
        # ─── ET LA COUVERTURE, SUR UBUNTU SEULEMENT ─────────────────────────
        #
        # `vitest.config` porte un CLIQUET de couverture (voir son commentaire).
        # Il ne mord que sous `--coverage` — sans ce drapeau, le seuil était
        # écrit et jamais exercé, c'est-à-dire du décor. C'est exactement ce que
        # le point 3e du point de sortie appelait « pas câblé ».
        #
        # Sur `ubuntu-latest` seulement, et pour la même raison que le badge :
        # le pourcentage est le même partout, et l'instrumentation v8 coûte du
        # temps qu'on ne paie pas trois fois pour un chiffre identique.
        #
        # Dans le MÊME pas que les tests, pas dans un second : rejouer la suite
        # entière pour la mesurer doublerait la jambe la plus longue.
        env:
          HIVE_VITEST_FORKS: ${{ inputs.forks }}
        run: npm test -- --reporter=default --reporter=json --outputFile.json=rapport-tests.json ${{ matrix.os == 'ubuntu-latest' && '--coverage' || '' }}

      # ─── LE COMPTE ANNONCÉ PAR LES BADGES ───────────────────────────────────
      #
      # Le compte réel n'existe qu'APRÈS l'exécution : aucune garde écrite DANS
      # la suite ne peut le connaître. Celle-ci lit le rapport et refuse un
      # badge périmé — deux fois qu'il l'était, deux fois corrigé à la main.
      #
      # Sur `ubuntu-latest` seulement — et pas seulement par économie. Le TOTAL
      # est le même partout, mais cet outil compare AUSSI les verts et les
      # ignorés, et cette répartition-là dépend de la machine : les bancs
      # réservés à Windows ou à macOS n'y sont pas ignorés. Le lancer sur les
      # trois jambes exigerait donc du tableau A trois répartitions à la fois,
      # ce qu'aucun jeu de nombres ne peut satisfaire. Une seule jambe fait foi.
      - name: Le badge annonce le vrai compte de tests
        if: matrix.os == 'ubuntu-latest'
        run: node scripts/compte-tests.mjs rapport-tests.json

      # ─── LES INSTALLEURS, EXERCÉS SUR LES TROIS PLATEFORMES ─────────────────
      #
      # `install.sh` et `install.ps1` vivent hors de la compilation, hors du
      # typage, hors de tout. Rien ne les regarderait — exactement la forme des
      # défauts que ce dépôt a passé sa journée à sortir.
      #
      # `--dry-run` s'arrête AVANT le clone, avant `npm install` et avant
      # l'installeur : le pas est donc rapide et n'écrit rien. Ce qu'il vérifie
      # est précisément ce qui casse en premier chez quelqu'un qui découvre le
      # projet — un script qui ne démarre pas, une syntaxe refusée par le shell
      # de la plateforme, un chemin mal formé.
      - name: L'installeur une-commande démarre (POSIX)
        if: runner.os != 'Windows'
        run: sh install.sh --dry-run --dir="$RUNNER_TEMP/essai-hive"

      # DEUX POWERSHELL, PARCE QU'IL Y EN A DEUX SUR LA MACHINE DES GENS.
      #
      # `pwsh` est PowerShell 7 : moderne, multiplateforme, INSTALLÉ À PART.
      # `powershell` est Windows PowerShell 5.1 : livré avec l'OS, c'est celui
      # qu'on obtient en ouvrant « PowerShell » dans le menu Démarrer, et donc
      # celui qui exécute réellement le script chez la plupart des gens.
      #
      # Ils ne lisent pas les fichiers de la même façon. Sans BOM, 5.1 décode en
      # ANSI et rend « dÃ©tectÃ© » là où 7 rend « détecté » — un écran d'accueil
      # en mojibake, invisible tant qu'on ne teste que `pwsh`. D'où le BOM en
      # tête d'`install.ps1`, et d'où CE pas : la seule façon de savoir qu'il
      # suffit est de lancer 5.1 pour de bon.
      # ─── ON EXERCE L'INVOCATION ANNONCÉE, PAS UNE INVOCATION VOISINE ────────
      #
      # Ce pas lançait `-NoProfile -File`. Il était vert, et il l'a toujours été.
      # Pendant ce temps le README, son homologue anglais, `docs/INSTALLATION.md`
      # et l'en-tête d'`install.ps1` annonçaient tous les quatre :
      #
      #     irm https://…/install.ps1 | iex
      #
      # Qui ne pouvait marcher sur AUCUNE machine — `iex` évalue une expression,
      # et `param()` n'est valide qu'au début d'un script. Un utilisateur l'a
      # signalé, avec la trace du `ParserError`.
      #
      # La CI exerçait donc le SCRIPT, jamais la PHRASE qui dit comment
      # l'appeler. Les deux étaient cohérents avec eux-mêmes et incohérents
      # entre eux, et rien ne regardait l'écart.
      #
      # Les drapeaux ci-dessous sont désormais ceux de la commande annoncée, et
      # `tests/commande-annoncee.test.ts` exige qu'ils le restent — sans quoi la
      # doc pourrait redériver sans que ce pas s'en aperçoive.
      - name: L'installeur une-commande démarre (Windows · PowerShell 7)
        if: runner.os == 'Windows'
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File install.ps1 -DryRun -Dir "$env:RUNNER_TEMP\essai-hive"

      # ─── CE PAS EST EN ASCII PUR, ET IL A FALLU UN ÉCHEC POUR L'APPRENDRE ───
      #
      # Première version : les assertions ci-dessous cherchaient « Ã » et
      # « Vérification » écrits tels quels. Le pas a rendu une ParserError —
      # parce que GitHub écrit le contenu de `run:` dans un `.ps1` TEMPORAIRE,
      # lui aussi SANS BOM, et le donne à 5.1. Mon « Ã » est devenu « Ãƒ », mon
      # « â€ » est devenu « Ã¢â‚¬ », le guillemet s'est retrouvé cassé.
      #
      # Le défaut que ce pas traque a donc mordu le pas lui-même. C'est la
      # meilleure démonstration possible qu'il valait la peine d'exister, et la
      # leçon est plus large qu'`install.ps1` : TOUT bloc `run:` sous
      # `shell: powershell` subit le même décodage.
      #
      # D'où : rien que de l'ASCII dans le `run:`. Les caractères accentués sur
      # lesquels on veut assener quelque chose sont construits par leur point de
      # code. Ces commentaires-ci, eux, vivent dans le YAML — que le runner lit
      # bien en UTF-8 — et ne descendent jamais dans le script temporaire.
      - name: L'installeur une-commande démarre (Windows · PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          # chcp 65001: without it the 5.1 console is on codepage 850/437 and
          # would print "?" even for a file that was decoded correctly. We want
          # to observe the FILE decoding, not the console limit.
          chcp 65001 > $null
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8

          # The EXACT flags the README tells people to type. A step that
          # exercises a neighbouring invocation proves nothing about the one
          # that is advertised - that is how `| iex` survived in four documents.
          $sortie = & powershell -NoProfile -ExecutionPolicy Bypass -File install.ps1 -DryRun -Dir "$env:RUNNER_TEMP\essai-hive-51" 2>&1 | Out-String
          Write-Host $sortie
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 returned $LASTEXITCODE under Windows PowerShell 5.1" }

          # U+00C3 (A-tilde) NEVER occurs in correctly decoded French. It is the
          # signature of UTF-8 re-read as ANSI. Without this assertion the step
          # would stay green while printing garbage.
          $aTilde = [char]0x00C3
          if ($sortie.Contains($aTilde)) { throw "mojibake: file re-read as ANSI, the BOM is missing" }

          # And the POSITIVE proof, which is the stronger one: the accented
          # characters must have survived. U+00E9 is 'e' acute, which the
          # prerequisites line contains.
          $eAcute = [char]0x00E9
          if (-not $sortie.Contains($eAcute)) { throw "no accented character survived: encoding is wrong" }
          if ($sortie -notmatch 'npm run install:hive') { throw "unexpected output under 5.1" }

      - name: Build (typecheck + dashboard)
        run: npm run build

  # ═══ LE TAMIS DES ORDRES ════════════════════════════════════════════════════
  #
  # La suite ci-dessus tourne toujours dans le MÊME ordre. Passée sous
  # `--sequence.shuffle`, elle perdait dix-sept fichiers : partout le même
  # motif, un test qui pose un état et un voisin qui le lit sans le dire.
  #
  # Ce n'est pas de l'hygiène. « NE TOUCHE PAS AUX LIENS VIVANTS » ne vérifiait
  # la moitié de sa borne qu'un ordre sur deux ; « REPRENDRE LA MÊME ISSUE NE
  # COLLISIONNE PAS » n'éprouvait aucune collision s'il passait en premier — le
  # défaut qu'il existe pour attraper lui était invisible. Un vert emprunté au
  # voisin ne protège rien, et rien ne pouvait le signaler.
  #
  # ─── POURQUOI UN TRAVAIL À PART, ET POURQUOI UN SEUL SYSTÈME ────────────────
  #
  # À part : il rejoue la suite trois fois, et l'attacher à la matrice
  # multiplierait ce coût par trois systèmes pour la même information — un
  # couplage entre deux tests ne dépend pas de l'OS.
  #
  # Les graines sont ÉCRITES, dans `scripts/tamis-ordres.mjs`. Une graine tirée
  # au hasard ferait rougir la CI sur un ordre que personne ne peut rejouer, et
  # la première réaction serait de relancer plutôt que de lire.
  tamis:
    name: La suite tient dans plusieurs ordres de tests
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js ${{ env.NODE }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE }}
          cache: npm

      - name: Installer les dépendances
        run: npm ci --foreground-scripts

      - name: Rejouer la suite dans trois ordres
        run: npm run tamis-ordres

  # ═══ LE SEUIL, FRANCHI ══════════════════════════════════════════════════════
  #
  # La matrice ci-dessus exerce `install.sh --dry-run`, et rien d'autre. Or le
  # mode sec s'arrête AVANT `npm install` — donc avant tout ce qui peut
  # réellement échouer chez un inconnu : la résolution des dépendances, le
  # module natif SQLite, la construction du tableau de bord, la ruche qui
  # démarre. L'unique commande du README était exercée JUSQU'AU SEUIL, jamais
  # franchie.
  #
  # ─── `--depot "$PWD"` : ON ÉPROUVE L'ARBRE QU'ON S'APPRÊTE À LIVRER ─────────
  #
  # Tirer de GitHub ferait vérifier `main`, c'est-à-dire du code DÉJÀ fusionné :
  # la CI dirait « l'installation marche » d'une version qui n'est pas celle de
  # la PR. On clone donc le dépôt local. `install.sh` clone par `--branch`, qui
  # veut un nom — or `actions/checkout` laisse une HEAD détachée : d'où la
  # branche posée juste avant.
  #
  # ─── UN SEUL SYSTÈME, ET C'EST DIT ─────────────────────────────────────────
  #
  # Ce pas ne tourne que sous Linux. Windows et macOS resteront exercés au
  # SEUIL seulement, par `--dry-run`. Ce n'est pas une couverture : c'est ce
  # qu'on peut mesurer, et le reste se dit plutôt que de se faire passer pour
  # vérifié (`docs/ETAPES.md`, « hors d'atteinte »).
  # ═══ LE SEUIL, SUR CHAQUE SYSTÈME OÙ ON PROMET QU'IL SE FRANCHIT ════════════
  #
  # Ce travail tournait sur `ubuntu-latest`, et seulement là. Sur macOS et
  # Windows, la CI n'exerçait que `install.sh --dry-run` — or le mode sec
  # s'arrête AVANT `npm install`, donc avant la résolution des dépendances,
  # avant le module natif SQLite, avant que la ruche démarre.
  #
  # La matrice à trois OS du travail principal mesure que LE CODE COMPILE ET QUE
  # LES BANCS PASSENT. Ce n'est pas la même phrase que « l'installation réussit »,
  # et les confondre était la façon la plus discrète de croire trois systèmes
  # couverts quand un seul l'était.
  #
  # macOS entre ici parce que c'est une plateforme de développeur très commune,
  # et que la commande du README n'y avait JAMAIS été menée à son terme — ni en
  # CI, ni sur une machine de terrain. Un arrivant qui la lance y fait quelque
  # chose que personne n'a vu réussir.
  #
  # Windows n'entre pas dans CETTE matrice, et ce n'est pas un oubli :
  # `install.ps1` est un chemin distinct, et ce script-ci est du shell POSIX.
  # Lui faire croire qu'il couvre Windows serait le mensonge rassurant.
  #
  # Ce commentaire disait ensuite « PowerShell 7 et 5.1, tous deux déjà exercés
  # au seuil » — et c'était vrai de l'invocation, pas du seuil. Les deux pas
  # Windows lancent `install.ps1 -DryRun`, qui s'arrête AVANT le clone, avant
  # `npm install`, avant l'installeur. Le seuil, personne ne le franchissait
  # là-bas. D'où le travail `seuil-windows` ci-dessous, avec son propre script.
  seuil:
    name: L'installation va jusqu'à une ruche qui répond · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Pas de `fail-fast` : si Linux tombe, on veut quand même savoir ce que
      # macOS a dit. Un arrêt anticipé transformerait deux mesures en une.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js ${{ env.NODE }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE }}

      - name: Nommer la révision à éprouver
        run: git branch -f essai-du-seuil HEAD

      # 78 = « je n'ai pas pu conclure » : un service tenait le port par défaut.
      # Sur un runner neuf ce cas ne devrait jamais arriver ; le confondre avec
      # un rouge apprendrait à relancer plutôt qu'à lire, alors il se signale.
      - name: L'installation, menée à son terme
        run: |
          set +e
          sh scripts/essai-installation.sh --depot "$PWD" --ref essai-du-seuil
          code=$?
          set -e
          if [ "$code" = 78 ]; then
            echo "::warning::essai non concluant — le port par défaut était tenu sur le runner"
            exit 0
          fi
          exit "$code"

  # ═══ LE MÊME SEUIL, SUR L'AUTRE CHEMIN ══════════════════════════════════════
  #
  # Un travail à part, et pas une entrée de plus dans la matrice ci-dessus : les
  # deux essais n'exécutent pas le même script, et une matrice qui lance la même
  # commande sur des plateformes qui n'en partagent pas l'interpréteur ne
  # mesurerait rien de plus qu'un `if`.
  #
  # Il affirme les mêmes choses que son jumeau POSIX — installation sortie en 0,
  # `.env` écrit, la ruche RÉPOND — SAUF la permission `0600`, qui n'a pas
  # d'équivalent Windows : Node n'y retient de `mode` que le bit « lecture
  # seule ». L'en-tête du script le dit ; simuler un contrôle d'ACL donnerait
  # une garde verte sur une protection absente.
  seuil-windows:
    name: L'installation va jusqu'à une ruche qui répond · windows-latest
    runs-on: windows-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js ${{ env.NODE }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE }}

      - name: Nommer la révision à éprouver
        run: git branch -f essai-du-seuil HEAD

      # `powershell` et non `pwsh` : 5.1 est celui qu'on obtient en ouvrant
      # « PowerShell » dans le menu Démarrer, donc celui qui exécute réellement
      # le script chez la plupart des gens. C'est le plus exigeant des deux.
      - name: L'installation, menée à son terme
        shell: powershell
        # ─── CE BLOC EST EN ASCII PUR, ET C'EST OBLIGATOIRE ──────────────────
        #
        # GitHub écrit le contenu de `run:` dans un `.ps1` temporaire SANS BOM,
        # et `shell: powershell` le donne à 5.1, qui décode alors en ANSI. Le
        # premier essai est mort là-dessus, AVANT d'exécuter quoi que ce soit :
        #
        #     + ... ssai non concluant â€” le port par dÃ©faut Ã©tait tenu ...
        #     The string is missing the terminator: ".
        #
        # Le tiret cadratin devient trois octets dont un GUILLEMET, et la chaîne
        # ne se referme plus. On ne peut pas poser de BOM sur un fichier que
        # GitHub fabrique : on n'y met donc aucun caractère accentué. Le SCRIPT,
        # lui, est un vrai fichier du dépôt et porte son BOM (garde dans
        # `tests/installeurs.test.ts`).
        run: |
          .\scripts\essai-installation.ps1 -Depot "$PWD" -Ref essai-du-seuil
          $code = $LASTEXITCODE
          if ($code -eq 78) {
            Write-Host "::warning::essai non concluant - port par defaut tenu sur le runner"
            exit 0
          }
          exit $code

  # ═══ L'IMAGE, CONSTRUITE POUR DE VRAI ═══════════════════════════════════════
  #
  # Un Dockerfile qu'on ne construit jamais est une promesse de plus que rien
  # n'exerce — exactement la forme de défaut que ce dépôt passe son temps à
  # sortir. Ce travail-ci la construit à chaque PR.
  #
  # Il ne la POUSSE nulle part : GHCR et la signature cosign dépendent de
  # comptes qui ne sont pas les miens. Construire est ce qui vérifie ; pousser
  # ne vérifie rien de plus.
  #
  # Un seul système : une image Linux se construit sur un runner Linux, et la
  # dupliquer sur trois plateformes coûterait dix minutes pour zéro information.
  image:
    name: L'image se construit, et la ruche y démarre
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js ${{ env.NODE }} pour le test d’intégration
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE }}
          cache: npm

      - name: Installer les dépendances pour le test d’intégration
        run: npm ci --foreground-scripts

      - name: Construire l'image
        run: docker build -t hive:ci .

      # ─── ET ELLE DÉMARRE. C'est ce qui distingue une image d'un fichier ────
      #
      # `better-sqlite3` est une dépendance OPTIONNELLE : une image où il aurait
      # échoué à s'installer se construit quand même, et ne meurt qu'au premier
      # démarrage. Construire sans démarrer laisserait passer précisément la
      # panne que le choix de `slim` plutôt qu'`alpine` existe pour éviter.
      - name: La ruche démarre dans l'image, et répond
        run: |
          docker run -d --name ruche-ci \
            -e HIVE_TOKEN=jeton-de-ci-suffisamment-long-pour-passer-les-gardes \
            -e HIVE_JWT_SECRET=secret-de-ci-suffisamment-long-pour-passer-les-gardes \
            -p 127.0.0.1:7777:7777 hive:ci
          # ─── `--retry-all-errors`, ET PAS `--retry-connrefused` ───────────
          #
          # On attend toujours ce qu'on attend plutôt qu'une durée devinée —
          # mais il faut attendre la BONNE erreur. Docker publie le port de
          # l'hôte dès le `run` : `docker-proxy` écoute AVANT que la ruche ne
          # soit prête. La connexion aboutit donc, puis elle est COUPÉE.
          #
          #     curl: (56) Recv failure: Connection reset by peer
          #
          # Ce n'est PAS « connection refused » (7), le seul cas que
          # `--retry-connrefused` reprend. Mesuré sur un port qui accepte puis
          # coupe, c'est-à-dire dans les conditions exactes ci-dessus :
          #
          #     --retry-connrefused   1 tentative, aucune reprise
          #     --retry-all-errors    4 tentatives (1 + 3 reprises)
          #
          # D'où l'échec en 0,2 s : la boucle d'attente ne bouclait pas.
          curl -fsS --retry 30 --retry-delay 1 --retry-all-errors \
            http://127.0.0.1:7777/api/health
          echo

      # ─── LE JOURNAL SORT MÊME — SURTOUT — QUAND ÇA ÉCHOUE ─────────────────
      #
      # `docker logs` était la dernière ligne du pas ci-dessus. Sous `bash -e`,
      # l'échec de `curl` l'emportait avec lui : la seule fois où ce journal
      # servait à quelque chose était la seule fois où il ne s'affichait pas.
      # Un diagnostic placé en aval de ce qu'il diagnostique n'existe pas.
      - name: Ce que le conteneur a dit
        if: always()
        run: |
          docker ps -a --filter name=ruche-ci \
            --format 'etat : {{.Status}}  ({{.Image}})'
          docker logs ruche-ci 2>&1 | tail -40 || echo '(aucun journal)'

      - name: Le module natif est BIEN là — pas seulement optionnel
        run: |
          docker run --rm hive:ci node -e "
            const d = require('better-sqlite3');
            const db = new d(':memory:');
            console.log('sqlite', db.prepare('select sqlite_version() v').get().v);
            db.close();
          "

      - name: L'image ne tourne PAS en root
        run: |
          u=$(docker run --rm hive:ci id -un)
          echo "utilisateur : $u"
          test "$u" = node

      # La Reine lance git elle-même (le miroir du Rayon) : sans lui dans
      # l'image, le code d'aucun projet ne se lisait en conteneur. Le travail
      # `compose` ci-dessous le prouve de bout en bout, par un vrai clone.
      - name: git est dans l'image — la Reine s'en sert
        run: docker run --rm hive:ci git --version

      - name: Ce que l'image pèse
        run: docker image inspect hive:ci --format '{{.Size}}' | awk '{printf "%.0f Mo\n", $1/1048576}'

      # Image distincte du bureau Atelier : elle contient les CLI que le
      # preflight du Worker doit trouver dans le conteneur, pas sur l'hôte.
      #
      # Construite par la commande que le nœud donne à l'opérateur
      # (`npm run bac:image`), sous le nom par défaut (`IMAGE_DEFAUT`) : sans
      # cela, le chemin qu'emprunte l'opérateur — construire, puis démarrer
      # sans HIVE_ISOLEMENT_IMAGE — ne tournait jamais en CI. `hive-agent:ci`
      # en est un second nom, pour les bancs qui nomment l'image.
      - name: Construire l'image agent-aware
        run: |
          npm run bac:image -- --moteur docker
          docker tag localhost/hive-agent:local hive-agent:ci

      - name: Vérifier les CLI agent-aware dans leur image
        run: |
          docker run --rm hive-agent:ci claude --version
          docker run --rm hive-agent:ci codex --version
          docker run --rm hive-agent:ci cline --version
          test "$(docker run --rm hive-agent:ci id -u)" = "1000"

      # Même ligne que `envelopper`, avec l'UID/GID du runner. Cette sonde
      # rend visible un refus Docker de montage ou de permissions avant que le
      # test TypeScript ne le réduise à « absent ou non exécutable ».
      - name: Vérifier le bac sous l’identité du runner
        run: |
          probe=$(mktemp -d)
          trap 'rm -rf "$probe"' EXIT
          docker run --rm \
            --interactive=false \
            --init \
            --pull=never \
            --volume="$probe:/hive/tache:rw" \
            --workdir=/hive/tache \
            --read-only \
            --tmpfs=/tmp:rw,noexec,nosuid,size=512m \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --user="$(id -u):$(id -g)" \
            --pids-limit=512 \
            --memory=2g \
            --cpus=2 \
            --env=HOME=/tmp/hive-home \
            hive-agent:ci claude --version

      # La commande ci-dessus prouve que Docker voit les CLI. Ce test exerce
      # ensuite le même preflight que le Worker Hive, avec l’image construite
      # et le vrai moteur du runner. Sans cette étape, une divergence entre la
      # détection et l’exécution pourrait rester verte.
      - name: Preflight Hive réel de l’image agent-aware (Docker)
        env:
          HIVE_ISOLEMENT_IMAGE: hive-agent:ci
          HIVE_TEST_MOTEUR: docker
          HIVE_TEST_IMAGE_DEFAUT: '1'
        run: npm test -- --run tests/isolement-runtime.integration.test.ts tests/v2-alpha-scenario.test.ts

      # ─── PODMAN ROOTLESS, EXERCÉ POUR DE VRAI ─────────────────────────────
      #
      # Le banc choisissait « le moteur qui a l'image » : Docker, toujours.
      # Podman n'avait donc jamais tourné, et son défaut de fond (`--user` sans
      # `--userns=keep-id` : un subuid étranger qui ne peut écrire ni dans
      # l'atelier ni sur la socket du pont MCP) n'avait jamais pu se voir. La
      # même image passe ici dans le magasin de Podman, et `HIVE_TEST_MOTEUR`
      # impose Podman aux mêmes bancs : preflight, écriture dans l'atelier,
      # chemin Worker → tâche, ramassage des conteneurs orphelins, mission V2.
      - name: Podman reçoit la même image
        run: |
          set -e
          podman --version
          docker save hive-agent:ci localhost/hive-agent:local | podman load
          podman image inspect localhost/hive-agent:local --format '{{.Id}}'
          podman image inspect hive-agent:ci --format '{{.Id}}'
          # `--init` exige un binaire d'init sur l'hôte (catatonit) : l'absence
          # ferait échouer chaque preflight, en le disant.
          if ! podman run --rm --init --pull=never hive-agent:ci true; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends catatonit
            podman run --rm --init --pull=never hive-agent:ci true
          fi

      # Deux lancements, dans cet ordre, et pas en parallèle : le premier
      # `--userns=keep-id` copie les couches de l'image à l'UID du runner
      # (`preparerImage`, éprouvé par le premier banc), et Podman tient son
      # stockage verrouillé pendant ce temps — les sondes du scénario V2
      # (`podman info`, 8 s) expireraient derrière lui.
      - name: Preflight Hive réel de l’image agent-aware (Podman rootless)
        env:
          HIVE_ISOLEMENT_IMAGE: hive-agent:ci
          HIVE_TEST_MOTEUR: podman
          HIVE_TEST_IMAGE_DEFAUT: '1'
        run: |
          npm test -- --run tests/isolement-runtime.integration.test.ts
          npm test -- --run tests/v2-alpha-scenario.test.ts

      - name: Arrêter
        if: always()
        run: docker rm -f ruche-ci 2>/dev/null || true

  # ═══ LA RUCHE EN COMPOSE, EXPLOITÉE COMME CHEZ QUELQU'UN ═══════════════════
  #
  # Le travail `image` prouve qu'un `docker run` NU démarre. Personne n'exploite
  # une ruche ainsi : on la pose par `docker compose up`, elle redémarre, elle
  # tombe, on la relance. Aucun de ces gestes n'était exercé, et les poser a
  # trouvé deux pannes que seule l'exploitation montre — pas de git dans
  # l'image (le code d'aucun projet ne se lisait), et un `.env` copié de
  # l'exemple qui faisait écouter la Reine sur SA boucle locale : saine pour la
  # sonde de santé, injoignable pour tous.
  #
  # Le déroulé est dans `scripts/essai-conteneurs.mjs` (en-tête) : `up --wait`
  # depuis un `.env` d'opérateur, PID 1 tenu par un init, un compte, un projet,
  # une clé de la Chambre et le code du projet relus après `compose restart`,
  # après un `kill -9` de la Reine DEPUIS L'HÔTE (relevée par `unless-stopped`)
  # et après `down` puis `up` ; la sauvegarde documentée sort du volume.
  compose:
    name: La ruche en compose survit aux redémarrages, et garde tout
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js ${{ env.NODE }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE }}
          cache: npm

      # L'hôte relit la sauvegarde avec `better-sqlite3` : d'où les dépendances.
      - name: Installer les dépendances
        run: npm ci --foreground-scripts

      - name: Le cycle de vie, de bout en bout
        run: node scripts/essai-conteneurs.mjs compose

      # Même règle que le travail `image` : le journal doit sortir SURTOUT
      # quand l'essai a échoué, c'est la seule fois où il sert.
      - name: Ce que la ruche a dit
        if: always()
        run: docker compose -p hive-essai -f docker-compose.yml logs --no-color --tail 120 || echo '(aucun journal)'

      - name: Arrêter, volumes compris
        if: always()
        run: docker compose -p hive-essai -f docker-compose.yml down -v || true

  # ═══ HIVE CLOUD, DERRIÈRE LE VRAI CADDY ═════════════════════════════════════
  #
  # `docker-compose.cloud.yml` et le Caddyfile n'avaient jamais tourné : seule
  # leur EXISTENCE était vérifiée. Ici ils tournent tels que livrés — le
  # Caddyfile n'est pas remplacé par une copie d'essai. `HIVE_DOMAIN` y vaut
  # un nom en `.localhost`, qui ne peut avoir de certificat public : Caddy le
  # sert alors avec son autorité INTERNE, dont la racine est copiée hors du
  # volume pour VÉRIFIER le certificat (un `curl -k` ne prouverait rien).
  #
  # Deux clients, dans deux conteneurs — deux adresses, comme sur Internet —
  # éprouvent `HIVE_TRUST_PROXY=uniquelocal` à travers le vrai proxy : l'un
  # s'acharne sous des `X-Forwarded-For` forgés jusqu'au 429, l'autre garde
  # son compteur et monte en WebSocket. C'est la preuve « derrière un vrai
  # Caddy » que la carte de la confiance au proxy réclamait.
  cloud:
    name: Hive Cloud répond derrière Caddy, un compteur par client
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js ${{ env.NODE }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE }}
          cache: npm

      # La sonde parle HTTPS et WebSocket (`ws`), sur l'hôte comme dans les
      # conteneurs clients.
      - name: Installer les dépendances
        run: npm ci --foreground-scripts

      - name: Le Cloud derrière Caddy, de bout en bout
        run: node scripts/essai-conteneurs.mjs cloud

      - name: Ce que la ruche et Caddy ont dit
        if: always()
        run: docker compose -p hive-essai-cloud -f docker-compose.cloud.yml logs --no-color --tail 120 || echo '(aucun journal)'

      - name: Arrêter, volumes compris
        if: always()
        run: docker compose -p hive-essai-cloud -f docker-compose.cloud.yml down -v || true

  # ═══ LA MONTÉE DE VERSION, SUR LES DONNÉES D'UNE RUCHE QUI A VÉCU ═══════════
  #
  # `docs/RELEASING.md` promet qu'une ruche passe d'une version étiquetée à la
  # suivante sans rien perdre. Ce travail le tient : la version PRÉCÉDENTE
  # (la plus récente étiquette `vX.Y.Z` qui n'est pas l'arbre éprouvé) démarre
  # en compose et pose ses données dans le volume ; l'arbre courant démarre
  # sur le même volume et doit tout relire — compte, projet, clé, code.
  #
  # ─── SANS ÉTIQUETTE, IL LE DIT — IL NE FAIT PAS SEMBLANT ───────────────────
  #
  # Tant qu'aucune version n'est étiquetée, il n'y a rien d'où monter. Le
  # premier pas l'écrit en avis dans le résumé de l'exécution, et les pas
  # suivants sont sautés : un vert ici veut alors dire « rien à éprouver »,
  # et c'est écrit, pas un vert muet.
  montee:
    name: La ruche monte de la version précédente sans rien perdre
    runs-on: ubuntu-latest
    steps:
      # Toute l'histoire et les étiquettes : c'est d'elles qu'on part.
      - name: Récupérer le code et ses étiquettes
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Node.js ${{ env.NODE }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE }}
          cache: npm

      - name: La version d'où monter
        id: precedente
        run: node scripts/essai-conteneurs.mjs precedente

      - name: Installer les dépendances
        if: steps.precedente.outputs.etiquette != ''
        run: npm ci --foreground-scripts

      # L'étiquette passe par l'environnement, pas par le texte du script :
      # une expression `${{ }}` collée dans `run:` devient du shell.
      - name: De la version précédente à celle-ci, sur le même volume
        if: steps.precedente.outputs.etiquette != ''
        env:
          ETIQUETTE: ${{ steps.precedente.outputs.etiquette }}
        run: node scripts/essai-conteneurs.mjs montee --depuis "$ETIQUETTE"

      - name: Ce que la ruche a dit
        if: always() && steps.precedente.outputs.etiquette != ''
        run: docker compose -p hive-montee -f docker-compose.yml logs --no-color --tail 120 || echo '(aucun journal)'

      - name: Arrêter, volumes compris
        if: always() && steps.precedente.outputs.etiquette != ''
        run: docker compose -p hive-montee -f docker-compose.yml down -v || true
