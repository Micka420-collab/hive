name: CI

# Intégration continue de Hive : à chaque push sur main et sur chaque PR, on
# vérifie la qualité (lint + format), le typage, les tests et le build.
#
# ─── POURQUOI DEUX SYSTÈMES, ET PAS UN ───────────────────────────────────────
#
# Le dépôt annonce Windows partout : le README, l'installeur, la matrice de
# distribution (§7.2 de la mission), et jusqu'au code — `hive doctor` rend
# `null` pour les permissions « sur Windows, où l'ACL ne se lit pas en bits
# POSIX ». Cette branche-là n'avait JAMAIS tourné sur Windows. On ne pouvait la
# vérifier qu'en passant `'win32'` en paramètre, c'est-à-dire en se croyant sur
# parole.
#
# C'est le même défaut que partout ailleurs dans ce dépôt, une couche plus
# haut : une promesse écrite que rien n'exerce. Le critère 7 du definition of
# done l'exigeait depuis le début — « CI verte sur ubuntu-latest ET
# windows-latest ».
#
# `fail-fast: false` : si les deux cassent, on veut les DEUX rapports. Arrêter
# l'autre au premier échec transformerait deux diagnostics en un seul.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  qualite:
    name: ${{ matrix.os }} · Node ${{ matrix.node }} · Lint · Typecheck · Tests · Build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ─── POURQUOI LES DEUX JAMBES NE TOURNENT PAS SUR LE MÊME NODE ─────────
        #
        # Ce n'est pas un caprice, c'est un empilement qu'on ne contrôle pas, et
        # il a fallu trois runs pour le voir en entier.
        #
        # `better-sqlite3` ne publie AUCUN binaire prébuilt — pour aucune
        # plateforme. `prebuild-install` le dit sur les deux systèmes :
        #
        #   No prebuilt binaries found (target=20.20.2 runtime=node arch=x64 …)
        #
        # Il se COMPILE donc partout. Linux passe : gcc et python3 sont là.
        # Sous Windows, le runner a bien Visual Studio — 18 Enterprise — et la
        # compilation échouait quand même :
        #
        #   gyp ERR! find VS Failure details: RangeError [ERR_CHILD_PROCESS_STDIO_MAXB
        #   gyp ERR! find VS unknown version "undefined" found at
        #                    "C:\Program Files\Microsoft Visual Studio\18\Enterprise"
        #
        # Le compilateur EST là. C'est `node-gyp` 10.1.0 — celui que npm 10
        # embarque avec Node 20 — dont le sondage PowerShell dépasse son propre
        # `maxBuffer` : il ne peut pas lire la réponse, et conclut qu'il n'y a
        # pas de compilateur.
        #
        # ET ON NE PEUT PAS LE REMPLACER. Les deux voies documentées sont
        # mortes en npm 10, essayées l'une après l'autre :
        #
        #   npm config set node_gyp …  →  npm error `node_gyp` is not a valid npm option
        #   npm_config_node_gyp=…      →  variable bien posée, npm l'ignore :
        #                                 « gyp info using node-gyp@10.1.0 »
        #
        # Le composant cassé est donc la VERSION DE NPM, pas la machine. npm 11
        # (Node 24) embarque node-gyp 11, qui sait lire Visual Studio 2026.
        #
        # Chaque jambe garde donc le rôle qu'elle peut vraiment tenir :
        include:
          # Le PLANCHER documenté (`NODE_MINIMUM = 20`), vérifié là où rien ne
          # l'empêche. C'est la version que le README exige.
          - os: ubuntu-latest
            node: '20'
          # Windows sert à exercer les chemins win32 — séparateurs, ACL, liens
          # symboliques, `spawn`. Pour ça il faut que SQLite se charge, donc un
          # npm dont le node-gyp voit le compilateur installé.
          - os: windows-latest
            node: '24'
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # `--foreground-scripts` rend VISIBLE ce que font les scripts d'install.
      # Sans lui, l'échec du module natif de `better-sqlite3` — qui est une
      # dépendance OPTIONNELLE, donc silencieusement abandonnée — n'apparaît
      # nulle part, et on hérite de 68 fichiers de test qui échouent à l'import
      # sans qu'aucune ligne du journal n'explique pourquoi.
      - name: Installer les dépendances
        run: npm ci --foreground-scripts

      # Et on DIT ce qui a atterri. Un `npm ci` vert avec Fastify et SQLite
      # absents est le pire des deux : tout a l'air d'aller.
      - name: Ce que les dépendances optionnelles ont donné
        run: node scripts/deps-optionnelles.mjs

      - name: Lint (ESLint + Prettier)
        run: npm run lint

      - name: Typecheck (orchestrateur + nœud)
        run: npm run typecheck

      - name: Typecheck (dashboard)
        run: npm run typecheck:dashboard

      - name: Tests (vitest, unitaires + e2e)
        run: npm test

      - name: Build (typecheck + dashboard)
        run: npm run build
