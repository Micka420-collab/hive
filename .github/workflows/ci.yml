name: CI

# Intégration continue de Hive : à chaque push sur main et sur chaque PR, on
# vérifie la qualité (lint + format), le typage, les tests et le build.
#
# ─── POURQUOI TROIS SYSTÈMES, ET PAS UN ──────────────────────────────────────
#
# Le dépôt annonce Windows partout : le README, l'installeur, la matrice de
# distribution (§7.2 de la mission), et jusqu'au code — `hive doctor` rend
# `null` pour les permissions « sur Windows, où l'ACL ne se lit pas en bits
# POSIX ». Cette branche-là n'avait JAMAIS tourné sur Windows. On ne pouvait la
# vérifier qu'en passant `'win32'` en paramètre, c'est-à-dire en se croyant sur
# parole.
#
# CE QUE L'OUVRIR A COÛTÉ, ET RAPPORTÉ. Neuf allers-retours, et cinq défauts
# RÉELS qu'aucune relecture n'aurait trouvés : `npm ci` inopérant sur tout nœud
# Windows (un `.cmd` ne se lance pas sans interpréteur), un clone qui attendait
# des identifiants POUR TOUJOURS, une borne d'élagage qui gardait ZÉRO ligne au
# lieu de deux, une variante `.cmd` qui ne pouvait pas aboutir dans la détection
# d'agent, et sept avis de sécurité dont un réel. Le détail est dans
# `docs/ERREURS.md`.
#
# MACOS EST LA TROISIÈME, et le lot 6 la demandait depuis le début (« CI verte
# sur les 3 OS »). Ce n'est pas de la symétrie : c'est là que vivent `launchd`
# — le lot 9 en dépend et s'écrirait à l'aveugle sans elle —, un système de
# fichiers INSENSIBLE À LA CASSE par défaut, et l'absence de tout moteur de
# conteneurs sur les runners. Trois différences que rien n'exerce aujourd'hui.
#
# `fail-fast: false` : si plusieurs cassent, on veut TOUS les rapports. Arrêter
# les autres au premier échec transformerait trois diagnostics en un seul.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# ─── LA VERSION DE NODE, DÉCLARÉE UNE SEULE FOIS ─────────────────────────────
#
# `NODE_MINIMUM` vaut 24 dans `src/shared/doctor.ts`, et la CI doit tourner sur
# le plancher qu'elle exige — sans quoi elle vérifierait une configuration que
# personne n'installe.
#
# Le 24 n'est pas une préférence pour le neuf. Il retire une panne :
# `better-sqlite3` est un module natif, et sous Node 20 aucun binaire prébuilt
# n'existe pour cette ABI. Il faut compiler — 42 lignes de `node-gyp` sous
# Linux, et sous Windows un échec net, le `node-gyp` d'npm 10 ne sachant pas
# lire Visual Studio 2026. Sous Node 24, `prebuild-install` trouve le binaire :
# zéro compilation, 28 secondes, aucun outillage C++ nécessaire. Les deux
# comportements ont été mesurés sur le MÊME commit, dans le run 210.
env:
  NODE: '24'

jobs:
  qualite:
    name: ${{ matrix.os }} · Node 24 · Lint · Typecheck · Tests · Build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js ${{ env.NODE }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE }}
          cache: npm

      # `--foreground-scripts` rend VISIBLE ce que font les scripts d'install.
      # Sans lui, l'échec du module natif de `better-sqlite3` — qui est une
      # dépendance OPTIONNELLE, donc silencieusement abandonnée — n'apparaît
      # nulle part, et on hérite de 68 fichiers de test qui échouent à l'import
      # sans qu'aucune ligne du journal n'explique pourquoi.
      - name: Installer les dépendances
        run: npm ci --foreground-scripts

      # Et on DIT ce qui a atterri. Un `npm ci` vert avec Fastify et SQLite
      # absents est le pire des deux : tout a l'air d'aller.
      - name: Ce que les dépendances optionnelles ont donné
        run: node scripts/deps-optionnelles.mjs

      - name: Lint (ESLint + Prettier)
        run: npm run lint

      - name: Typecheck (orchestrateur + nœud)
        run: npm run typecheck

      - name: Typecheck (dashboard)
        run: npm run typecheck:dashboard

      - name: Tests (vitest, unitaires + e2e)
        run: npm test

      # ─── LES INSTALLEURS, EXERCÉS SUR LES TROIS PLATEFORMES ─────────────────
      #
      # `install.sh` et `install.ps1` vivent hors de la compilation, hors du
      # typage, hors de tout. Rien ne les regarderait — exactement la forme des
      # défauts que ce dépôt a passé sa journée à sortir.
      #
      # `--dry-run` s'arrête AVANT le clone, avant `npm install` et avant
      # l'installeur : le pas est donc rapide et n'écrit rien. Ce qu'il vérifie
      # est précisément ce qui casse en premier chez quelqu'un qui découvre le
      # projet — un script qui ne démarre pas, une syntaxe refusée par le shell
      # de la plateforme, un chemin mal formé.
      - name: L'installeur une-commande démarre (POSIX)
        if: runner.os != 'Windows'
        run: sh install.sh --dry-run --dir="$RUNNER_TEMP/essai-hive"

      - name: L'installeur une-commande démarre (Windows)
        if: runner.os == 'Windows'
        run: pwsh -NoProfile -File install.ps1 -DryRun -Dir "$env:RUNNER_TEMP\essai-hive"

      - name: Build (typecheck + dashboard)
        run: npm run build
