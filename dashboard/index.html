<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23F6C445' d='M12 2.2 20.2 7v10L12 21.8 3.8 17V7L12 2.2Z'/%3E%3Cpath fill='%23141210' d='M12 6.2 16.8 9v6L12 17.8 7.2 15V9L12 6.2Z'/%3E%3C/svg%3E"
    />
    <title>Hive — Mission Control</title>
    <!-- Le thème CHOISI, posé avant la première image : le module de
         l'application ne tourne qu'après l'analyse du document, et un choix
         « clair » sur un OS sombre (ou l'inverse) flasherait le temps d'une
         image. Même clé et mêmes valeurs que src/theme.ts ; stockage absent
         ou qui lève = « système », sans attribut. -->
    <script>
      try {
        const t = localStorage.getItem('hive.theme');
        if (t === 'sombre' || t === 'clair')
          document.documentElement.setAttribute('data-theme', t === 'sombre' ? 'dark' : 'light');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
