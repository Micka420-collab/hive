<!doctype html>
<!-- La barre latérale de l'installeur Windows (pages d'accueil et de fin),
     164 × 314 : NSIS l'affiche à gauche, à cette taille exacte. -->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face { font-family: 'Titre'; src: url('{{police-titre}}'); font-weight: 400 700; }
      @font-face { font-family: 'Texte'; src: url('{{police-texte}}'); font-weight: 400 600; }
      html, body { margin: 0; width: 164px; height: 314px; overflow: hidden; }
      body {
        background:
          radial-gradient(220px 200px at 50% 34%, {{halo}}, transparent 70%),
          linear-gradient(180deg, {{panneau}}, {{fond}});
        color: {{texte}};
        font-family: 'Texte', sans-serif;
        position: relative;
      }
      .icone { position: absolute; top: 64px; left: 32px; width: 100px; height: 100px; }
      .nom { position: absolute; top: 176px; width: 100%; text-align: center; font: 700 28px/1 'Titre', sans-serif; letter-spacing: -0.01em; }
      .accroche { position: absolute; top: 214px; left: 16px; right: 16px; text-align: center; color: {{attenue}}; font-size: 11px; line-height: 1.35; }
      .filet { position: absolute; bottom: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, {{miel}}, {{mielFonce}}); }
    </style>
  </head>
  <body>
    <img class="icone" src="{{icone}}" alt="" />
    <div class="nom">{{nom}}</div>
    <div class="accroche">{{accroche}}</div>
    <div class="filet"></div>
  </body>
</html>
